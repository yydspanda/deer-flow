[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-trace-agent"
version = "0.1.0"
description = "Independent Trace investigation service contracts and development shell"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13,<3",
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.31",
    "uvicorn>=0.34,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
